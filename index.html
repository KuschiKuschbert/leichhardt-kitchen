<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="css/app.css">
<script>
  // Apply the saved text size before the page draws, so nothing jumps.
  try { var s = JSON.parse(localStorage.getItem('lk.settings.v1') || '{}'); if (s.text) document.documentElement.setAttribute('data-text', s.text); } catch (e) {}
</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="app"></div>
<noscript><p style="padding: 24px; font-family: sans-serif">The recipe book needs JavaScript switched on.</p></noscript>
<script src="js/data.js" defer></script>
<script src="js/art.js" defer></script>
<script src="js/firebase-config.js" defer></script>
<script src="js/prep.js" defer></script>
<script src="js/app.js" defer></script>
<script>
  // Daily self-refresh: the book reloads itself once a day (about 04:00) so a tablet left open on the pass
  // always shows the latest cards. If the device was asleep at 04:00, it refreshes as soon as it wakes.
  (function () {
    var DAY = 24 * 60 * 60 * 1000, CATCH_UP = 20 * 60 * 60 * 1000, loaded = Date.now();
    function nextFour() { var d = new Date(); d.setHours(4, 0, 0, 0); if (d.getTime() <= Date.now() + 60000) d.setDate(d.getDate() + 1); return d.getTime(); }
    function refresh() {
      // Re-fetch the data files past the browser cache first, so the reload shows the newest cards. The page stays on the same card.
      var files = ['js/data.js', 'js/art.js', 'js/app.js', 'js/prep.js', 'js/firebase-config.js', 'css/app.css'];
      var go = function () { location.reload(); };
      try {
        Promise.all(files.map(function (f) { return fetch(f, { cache: 'reload' }); })).then(go, go);
        setTimeout(go, 8000);
      } catch (e) { go(); }
    }
    var timer = null;
    function schedule() { clearTimeout(timer); timer = setTimeout(refresh, Math.max(1000, nextFour() - Date.now())); }
    schedule();
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState !== 'visible') return;
      if (Date.now() - loaded > CATCH_UP) refresh(); else schedule();
    });
  })();
</script>
<script>
  // Installable: the service worker keeps the last copy of the book so it opens with no signal.
  if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
</script>
</body>
</html>
