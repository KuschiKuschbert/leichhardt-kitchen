# Proves the lock on the live book: from a client that holds only the kitchen PIN, the reads and writes the published
# rules must refuse are refused, and the one read they must allow is allowed (tests/rules/probe.mjs). Runs every Monday
# at 04:00 kitchen time and from the Actions tab, and the Publish rules workflow runs the same probe after each publish.
# Needs the KITCHEN_PIN secret, and APPCHECK_DEBUG_TOKEN once App Check is enforced. Nothing is written: every write it tries is one the rules refuse. The PIN is never
# printed. A failed run means the published rules no longer match firestore.rules: publish them again.
name: Lock probe

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 0'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/rules/package-lock.json
      - name: Install
        working-directory: tests/rules
        run: npm ci --no-audit --no-fund
      - name: Prove the lock on the live book
        working-directory: tests/rules
        env:
          KITCHEN_PIN: ${{ secrets.KITCHEN_PIN }}
          APPCHECK_DEBUG_TOKEN: ${{ secrets.APPCHECK_DEBUG_TOKEN }}
        run: node probe.mjs
