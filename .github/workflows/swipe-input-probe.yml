name: Temporary swipe input probe
on:
  push:
    branches: [feat/swipe-pages]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: tests
      - name: Trace native edge touches
        working-directory: tests
        env:
          CHROME: /usr/bin/google-chrome
          BASE: http://127.0.0.1:8777/
        run: |
          node serve.js 8777 > /tmp/swipe-server.log 2>&1 &
          node swipe-pages.test.js
