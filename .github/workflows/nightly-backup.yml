# Weekly backup: every Sunday at 03:30 kitchen time (Saturday 17:30 UTC) the book is read the way the admin panel's Backup
# button reads it (scripts/nightly-backup.mjs), encrypted with the BACKUP_KEY secret and kept as a GitHub artifact for
# 90 days. The repository is public and anyone signed in to GitHub can download an artifact, so the file is never kept
# in the clear. Needs three repository secrets: FIREBASE_SA (service account key, JSON), KITCHEN_PIN and BACKUP_KEY
# (a long random passphrase; keep a copy in your password manager, a lost key means unreadable backups).
# Recovery commands and the explicit trusted legacy format are documented in docs/backup-recovery.md.
# Run it by hand from the Actions tab with "Run workflow".
# Weekly since Plan C (4.3, docs/firestore-usage.md): Firestore's own scheduled backups (daily, kept 7 days; weekly,
# kept 14 weeks) are the first copy, with no reads. This encrypted copy is the one kept outside Google. A week-old
# earlier file is too old to reuse (scripts/nightly-backup.mjs, 36 hours), so each run reads the whole window.
name: Weekly backup

on:
  schedule:
    - cron: '30 17 * * 6'
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # last night's backup file (Plan B 4.2): the older days are taken from it, not read again

concurrency:
  group: nightly-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the key is there before reading anything
        env:
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
        run: |
          [ "${#BACKUP_KEY}" -ge 16 ] || { echo "The BACKUP_KEY secret is missing or shorter than 16 characters. Add a long random passphrase as the BACKUP_KEY repository secret. Nothing was read."; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - name: Install
        working-directory: scripts
        run: npm ci --no-audit --no-fund
      # Plan B 4.2 (7 Nov 2026, docs/backup-recovery.md): last night's file, decrypted into the runner's temporary folder
      # only, so the days older than 14 that no fix names come from it. Anything wrong here and every day is read.
      - name: Last night's backup, for the days that have not changed
        id: prev
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nightly-backup.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
          [ -n "$id" ] || { echo "No earlier backup. Every day is read."; exit 0; }
          gh run download "$id" -R "$GITHUB_REPOSITORY" -D "$RUNNER_TEMP/prev"
          file=$(find "$RUNNER_TEMP/prev" -name '*.json.enc' | head -1)
          [ -n "$file" ] || { echo "The earlier backup has no file. Every day is read."; exit 0; }
          node scripts/backup-crypto.mjs decrypt "$file" "$RUNNER_TEMP/prev.json"
          echo "file=$RUNNER_TEMP/prev.json" >> "$GITHUB_OUTPUT"
      - name: Read the book
        working-directory: scripts
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          KITCHEN_PIN: ${{ secrets.KITCHEN_PIN }}
          PREV_BACKUP: ${{ steps.prev.outputs.file }}
        run: node nightly-backup.mjs "$RUNNER_TEMP/backup.json"
      - name: Encrypt and verify
        env:
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          backup_archive="$RUNNER_TEMP/out/kitchen-book-$(date -u +%Y-%m-%d).json.enc"
          node scripts/backup-crypto.mjs encrypt "$RUNNER_TEMP/backup.json" "$backup_archive"
          node scripts/backup-crypto.mjs decrypt "$backup_archive" "$RUNNER_TEMP/backup-verified.json"
          cmp -s -- "$RUNNER_TEMP/backup.json" "$RUNNER_TEMP/backup-verified.json" || { echo "Protected backup verification failed. Nothing will be uploaded."; exit 1; }
          ls -l "$RUNNER_TEMP/out"
      - name: Remove plaintext
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/backup.json" "$RUNNER_TEMP/backup-verified.json" "$RUNNER_TEMP/prev.json" "$RUNNER_TEMP/prev"
      - name: Keep it for 90 days
        uses: actions/upload-artifact@v4
        with:
          name: kitchen-book-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/out/*.json.enc
          retention-days: 90
          if-no-files-found: error
