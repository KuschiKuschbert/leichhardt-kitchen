# Publish the book to GitHub Pages, only when a file the phones load has changed (13 Nov 2026, docs/site-publishing.md).
# Every publish gives every file a new Last-Modified and ETag, and the book reads those to decide there is a new
# version: each phone then shows "New version available" and downloads all its startup files again. GitHub's own
# publish from the branch ran on every merge, notes and tests included: 14 of the 50 merges from 6 to 12 November
# changed nothing a phone loads. This compares the commit on main with the commit that is live now and publishes
# only when scripts/site-changed.sh finds a file the site needs. Run it by hand (Run workflow) to publish anyway.
# Needs Settings, Pages, Source: GitHub Actions. While Pages still publishes from the branch this only says so.
# Live click tests follow the Deploy job; Publish rules follows the Published job (it also runs when nothing was published).
# A venue served by its own Firebase project (venues/*.json with host firebase, docs/venues.md) gets its own copy of the
# same publish (scripts/venue-site.cjs: its settings, security header, name and an empty book) on its own address, in its
# own GitHub environment, straight after the Pages publish. Published waits for those too, so no venue's rules are ever
# published ahead of its code.
# Publish times (head chef, 24 Nov 2026, docs/loading-wait-options/brief.md): merges land at any time, but the phones get
# a new version only in the publish windows below (15:05 and 22:35, Queensland time), or at once for a pull request
# labelled urgent. Outside them a change waits (held) and Published does not run, so no rules go out ahead of their code;
# the timed runs in each window publish what waited (several, as GitHub can skip one). 16 to 36 versions a day had
# reloaded the phones coming back to the book (Mon 23 and Tue 24 Nov 2026).
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # UTC: 15:05 to 16:25 and 22:35 to 23:55 Queensland time, every 20 minutes
    - cron: '5,25,45 5 * * *'
    - cron: '5,25 6 * * *'
    - cron: '35,55 12 * * *'
    - cron: '15,35,55 13 * * *'

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read

# One publish at a time, never cut short. A run waiting behind it is replaced by a newer one, which compares
# with what is live, so it carries the replaced run's changes too.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # HHMM-HHMM, Queensland time, end not included (as RELEASE_WINDOWS in auto-merge.yml). Empty publishes at once.
  PUBLISH_WINDOWS: '1505-1630 2235-2400'

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      held: ${{ steps.decide.outputs.held }}
      source: ${{ steps.decide.outputs.source }}
      hosted: ${{ steps.hosted.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: The venues on their own address
        id: hosted
        run: echo "list=$(node scripts/venues.cjs matrix --hosted)" >> "$GITHUB_OUTPUT"
      - name: Decide whether the phones need a new copy
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          source=$(gh api "repos/$REPO/pages" --jq .build_type 2>/dev/null || echo unknown)
          echo "source=$source" >> "$GITHUB_OUTPUT"
          if [ "$source" = legacy ]; then
            echo "::warning::Pages still publishes from the branch on every push. Set Settings, Pages, Source to GitHub Actions. Until then this workflow publishes nothing."
            echo "deploy=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "Run by hand: publishing."; echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # the commit that is live now: the newest github-pages deployment whose latest status is success
          live=""
          for pair in $(gh api "repos/$REPO/deployments?environment=github-pages&per_page=30" --jq '.[] | "\(.id):\(.sha)"' 2>/dev/null || true); do
            state=$(gh api "repos/$REPO/deployments/${pair%%:*}/statuses?per_page=1" --jq '.[0].state' 2>/dev/null || true)
            if [ "$state" = success ]; then live=${pair#*:}; break; fi
          done
          if [ -z "$live" ] || ! git cat-file -e "$live^{commit}" 2>/dev/null; then
            echo "No live commit found: publishing."; echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          need=$(git diff --no-renames --name-only "$live" HEAD | bash scripts/site-changed.sh)
          if [ -n "$need" ]; then
            echo "Live is ${live:0:7}. Files the site needs changed since:"; echo "$need" | head -20
            # in a publish window? NOW_HHMM stands in for the clock in tests/site-publish.test.js
            open=true
            if [ -n "${PUBLISH_WINDOWS:-}" ]; then
              now=${NOW_HHMM:-$(TZ=Australia/Brisbane date +%H%M)}; open=false
              for w in $PUBLISH_WINDOWS; do [ $((10#$now)) -ge $((10#${w%-*})) ] && [ $((10#$now)) -lt $((10#${w#*-})) ] && open=true; done
            fi
            # a merge labelled urgent goes out at once; if GitHub does not say, it goes out rather than wait unseen
            if [ "$open" != true ] && [ "$EVENT" = push ]; then
              if labels=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[].labels[].name] | join(" ")' 2>/dev/null); then
                case " $labels " in *" urgent "*) open=true; echo "Labelled urgent: publishing now." ;; esac
              else
                open=true; echo "Could not read this merge's labels: publishing rather than hold a fix unseen."
              fi
            fi
            if [ "$open" = true ]; then
              echo "deploy=true" >> "$GITHUB_OUTPUT"
            else
              echo "Outside the publish windows ($PUBLISH_WINDOWS, Queensland time): held. The phones get it at the next window."
              echo "deploy=false" >> "$GITHUB_OUTPUT"; echo "held=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Live is ${live:0:7}. Nothing the phones load changed since: not publishing, so no phone is asked to update."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy
    needs: check
    if: needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
      deployments: read
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # v3 keeps dotfiles such as .nojekyll and leaves out .git and .github, like the publish from the branch
      - id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: ${{ env.PAGES_ARTIFACT_NAME }}
      - name: Wait for this attempt's Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          # A rerun can still see older attempts, and a successful upload can take a moment to appear in the list.
          if ! [[ "$PAGES_ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::The Pages upload did not return an artifact ID."
            exit 1
          fi
          for attempt in {1..8}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$PAGES_ARTIFACT_NAME&per_page=100" |
              jq -e --arg name "$PAGES_ARTIFACT_NAME" --arg id "$PAGES_ARTIFACT_ID" \
                '[.artifacts[] | select(.name == $name and .expired == false)] | length == 1 and (.[0].id | tostring) == $id' >/dev/null; then
              # The deploy action reads through the separate Actions Results endpoint.
              sleep 5
              exit 0
            fi
            if [ "$attempt" -lt 8 ]; then sleep 5; fi
          done
          echo "::error::Pages artifact $PAGES_ARTIFACT_NAME ($PAGES_ARTIFACT_ID) did not become visible."
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}

  venue-sites:
    name: Venue site (${{ matrix.venue.id }})
    needs: [check, deploy]
    if: ${{ needs.deploy.result == 'success' && needs.check.outputs.hosted != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        venue: ${{ fromJSON(needs.check.outputs.hosted) }}
    environment:
      name: ${{ matrix.venue.env }}
      deployment: false
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VENUE: ${{ matrix.venue.id }}
      PROJECT: ${{ matrix.venue.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/rules/package-lock.json
      - name: This venue's own project
        env:
          VENUE_PROJECT: ${{ vars.VENUE_PROJECT }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: node scripts/venues.cjs guard "$VENUE"
      - name: Install the Firebase CLI (the copy the rules tests use)
        working-directory: tests/rules
        run: npm ci --no-audit --no-fund
      - name: Make the venue's copy and publish it on its own address
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: bash scripts/venue-deploy.sh
      - name: Check the live copy
        run: sleep 20 && node scripts/venue-live-check.cjs "$VENUE"

  published:
    name: Published
    needs: [check, deploy, venue-sites]
    # not while a change is held for the next publish window: the rules wait with their code
    if: ${{ always() && needs.check.result == 'success' && needs.check.outputs.source != 'legacy' && needs.check.outputs.held != 'true' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') && (needs.venue-sites.result == 'success' || needs.venue-sites.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "The site is up to date with this commit."
