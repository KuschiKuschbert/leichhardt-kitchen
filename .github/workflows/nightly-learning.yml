# Nightly learning: every night at 03:00 kitchen time (17:00 UTC) the book learns from the finished kitchen days.
# See scripts/nightly-learn.mjs. Needs two repository secrets: FIREBASE_SA (service account key, JSON) and KITCHEN_PIN.
# Run it by hand from the Actions tab with "Run workflow".
name: Nightly learning

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-learning
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - name: Install
        working-directory: scripts
        run: npm ci --no-audit --no-fund
      - name: Learn
        working-directory: scripts
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          KITCHEN_PIN: ${{ secrets.KITCHEN_PIN }}
        run: node nightly-learn.mjs
