# Phone pushes for order cut-offs: every 10 minutes the book checks whether a supplier's cut-off reminder is due and
# sends a push to the chefs' phones that are turned on. See scripts/cutoff-push.mjs. Needs the repository secrets
# FIREBASE_SA (service account key, JSON) and KITCHEN_PIN, the same as the nightly learning.
# GitHub can start a scheduled run a few minutes late; a late run still sends while the cut-off is ahead.
name: Cut-off pushes

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cutoff-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - name: Install
        working-directory: scripts
        run: npm ci --no-audit --no-fund
      - name: Send
        working-directory: scripts
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          KITCHEN_PIN: ${{ secrets.KITCHEN_PIN }}
        run: node cutoff-push.mjs
