# The click tests against the live site (GitHub Pages), as CLAUDE.md asks after every merge.
# Runs by itself once Pages has deployed a change to main, and from the Actions tab with "Run workflow".
# Firebase is the stand-in from tests/fake, so no real PIN or data is needed and nothing is written to the real book.
name: Live click tests

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: live-tests
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    # Four shares on four runners at once, like the pull request check (3 Nov 2026): one runner took 24 minutes of
    # its 30. A failed file runs once more on its own (a warning if it then passes); failures are in the summary.
    name: Live ${{ matrix.shard }} of 4
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install
        working-directory: tests
        run: npm ci --no-audit --no-fund
      - name: Click through the live site
        working-directory: tests
        env:
          BASE: https://kuschikuschbert.github.io/leichhardt-kitchen/
          CHROME: /usr/bin/google-chrome
          JOBS: 4
          SHARD: ${{ matrix.shard }}/4
          QUIET: '1'
          RETRY: '1'
        run: npm test
      - name: Keep the screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.shard }}
          path: tests/shots
          if-no-files-found: ignore
