# The click tests against the live site (GitHub Pages), as CLAUDE.md asks after every merge.
# Runs by itself once Pages has deployed a change to main, and from the Actions tab with "Run workflow".
# Firebase is the stand-in from tests/fake, so no real PIN or data is needed and nothing is written to the real book.
name: Live click tests

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: live-tests
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install
        working-directory: tests
        run: npm ci --no-audit --no-fund
      - name: Click through the live site
        working-directory: tests
        env:
          BASE: https://kuschikuschbert.github.io/leichhardt-kitchen/
          CHROME: /usr/bin/google-chrome
          JOBS: 4
        run: npm test
      - name: Keep the screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: tests/shots
          if-no-files-found: ignore
