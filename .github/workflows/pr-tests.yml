# The click tests on every pull request to main, before it can merge.
# The job is called "Click tests": branch protection on main requires it, so nothing merges with a failing test.
# The runner serves the pull request's own copy of the book (tests/run.js, 127.0.0.1:8777) and clicks through it
# in the runner's Google Chrome. Firebase is the stand-in from tests/fake, so no real PIN or data is needed.
name: PR click tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Click tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install
        working-directory: tests
        run: npm ci --no-audit --no-fund
      - name: Check the JavaScript parses
        run: for f in js/*.js sw.js; do node --check "$f"; done
      - name: Click through this copy of the book
        working-directory: tests
        env:
          CHROME: /usr/bin/google-chrome
        run: npm test
      - name: Keep the screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: tests/shots
          if-no-files-found: ignore
