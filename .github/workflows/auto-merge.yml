# Merge when green, one pull request at a time (head chef, 4 Nov 2026). docs/auto-merge.md.
#
# A pull request marked ready (not a draft) and without the "hold" label gets GitHub's auto-merge (squash): it
# merges by itself once Click tests pass and it is up to date with main. When main moves, only the oldest ready pull
# request that is behind is brought up to date, so the others do not all run Click tests again.
#
# It acts with AUTOMERGE_TOKEN, a fine-grained token of the repository owner (contents and pull requests: read and
# write, this repository only). A merge made with the built-in GITHUB_TOKEN would not start the Pages deploy, the
# Live click tests or Publish rules. Without the secret this workflow only says so and does nothing.
name: Auto-merge

# When the queue looks (4 Nov 2026): a pull request changes, main moves, Click tests finish on any pull request, every
# 20 minutes, and by hand. The schedule is only the fallback: GitHub delays or drops scheduled runs when it is busy,
# most at the start of an hour, and on 4 Nov 2026 it ran once all evening. So it runs off the hour, and the end of
# every Click tests run moves the queue on. (check_suite is no use here: GitHub does not send it for Actions runs.)
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, converted_to_draft, labeled, unlabeled, synchronize]
  push:
    branches: [main]
  workflow_run:
    workflows: [PR click tests]
    types: [completed]
  schedule:
    - cron: '7,27,47 * * * *'
    # the release windows open (5 Nov 2026): 15:03 and 22:33 Queensland time, off the busy top of the hour
    - cron: '3 5 * * *'
    - cron: '33 12 * * *'
  workflow_dispatch:
    inputs:
      now:
        description: 'Release now: merge ready pull requests outside the release windows, for the next 30 minutes'
        type: boolean
        default: false
      wait:
        description: 'Wait for the next release window, then move the queue (the queue starts this run itself)'
        type: boolean
        default: false

# Release now and the waiting run (6 Nov 2026) carry their own names, so a later run can find them by name
# (released() and the look for a waiting run below). Every other run keeps GitHub's own name (the pull request or
# the commit).
run-name: "${{ github.event_name == 'workflow_dispatch' && (inputs.now && 'Release now' || inputs.wait && 'Waiting for the release window' || '') || '' }}"

permissions:
  contents: read

# Release windows (head chef, Plan B of docs/firestore-usage.md, 5 Nov 2026). Every merge is a new version, and every
# new version reloads the screens left open and every phone that comes back, each reload reading its lists again: on
# 4 and 5 Nov 2026, 48 merges in a day helped use up the free 50,000 reads by 13:00. So ready pull requests merge only
# in these windows, Queensland time, between services: HHMM-HHMM, end not included. A pull request labelled "urgent"
# merges when green at any time, and a run by hand with "Release now" opens the window for that run.
# The night window runs 22:30 to 02:30 (head chef, 8 Nov 2026), written as two that meet at midnight, as HHMM does
# not wrap: 2230-2400 and 0000-0230.
env:
  RELEASE_WINDOWS: '1500-1630 2230-2400 0000-0230'
  # One-off owner request, 14 Nov 2026 (at 02:50): keep releasing until 09:30 Queensland that morning. Full UTC date,
  # end excluded. (The one before: 9 Nov 2026, until 08:00 on 10 Nov.)
  RELEASE_UNTIL: '2026-11-13T23:30:00Z'

# Three jobs (4 Nov 2026): a waiting run in a shared concurrency group is replaced by the next one, so one shared group
# dropped the ready events of pull requests marked ready at the same moment. Each pull request now has its own group for
# its switch; only the queue shares one, where dropping an older waiting run is harmless (the next reads current state).

jobs:
  switch:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: auto-merge-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
      REPO: ${{ github.repository }}
      RUNS_TOKEN: ${{ github.token }}
    steps:
      - name: Token set?
        id: token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::AUTOMERGE_TOKEN is not set, so nothing is merged automatically (docs/auto-merge.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # The pull request that changed: ready and not held gets auto-merge in a release window, within 30 minutes of a
      # Release now, or at once when labelled urgent; outside a window it waits (auto-merge off) for the queue to switch
      # it on when the next window opens. A draft or a held one loses it.
      - name: Switch auto-merge on or off for this pull request
        if: steps.token.outputs.ok == 'true'
        env:
          PR: ${{ github.event.pull_request.number }}
          DRAFT: ${{ github.event.pull_request.draft }}
          SAME: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          HOLD: ${{ contains(github.event.pull_request.labels.*.name, 'hold') }}
          URGENT: ${{ contains(github.event.pull_request.labels.*.name, 'urgent') }}
        run: |
          # GitHub calls that change something are tried three times, 10 and 20 seconds apart: one GitHub error must not
          # cost a pull request its auto-merge or stall the queue (4 Nov 2026: a GraphQL outage left #518 without it).
          retry() { for i in 1 2 3; do "$@" && return 0; [ "$i" = 3 ] || sleep $((i * 10)); done; return 1; }
          # in a release window now? NOW_HHMM stands in for the clock in tests/auto-merge-queue.test.js
          now=${NOW_HHMM:-$(TZ=Australia/Brisbane date +%H%M)}; open=false
          for w in $RELEASE_WINDOWS; do [ $((10#$now)) -ge $((10#${w%-*})) ] && [ $((10#$now)) -lt $((10#${w#*-})) ] && open=true; done
          # A dated extension expires by itself. Reject relative/malformed dates; NOW_EPOCH stands in for UTC in tests.
          if [[ "${RELEASE_UNTIL:-}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] &&
             release_end=$(date -u -d "$RELEASE_UNTIL" +%s 2>/dev/null) &&
             [ "${NOW_EPOCH:-$(date -u +%s)}" -lt "$release_end" ]; then
            open=true; echo "Dated release extension: the window is open until $RELEASE_UNTIL."
          fi
          # A Release now holds the window open for 30 minutes (6 Nov 2026): it lasted only its own run, so the run its
          # own update of a pull request started switched auto-merge off again. Its runs are found by name (run-name).
          released() { GH_TOKEN="$RUNS_TOKEN" gh api "repos/$REPO/actions/workflows/auto-merge.yml/runs?event=workflow_dispatch&per_page=20" \
            --jq '[.workflow_runs[] | select(.display_title == "Release now") | select(now - (.created_at | fromdateiso8601) < 1800)] | length' 2>/dev/null | grep -qv '^0$'; }
          if [ "$open" != "true" ] && released; then open=true; echo "Released by hand in the last 30 minutes: the window is open."; fi
          if [ "$SAME" != "true" ]; then echo "From a fork: never merged automatically."; exit 0; fi
          if [ "$DRAFT" = "true" ] || [ "$HOLD" = "true" ]; then
            gh pr merge "$PR" -R "$REPO" --disable-auto 2>/dev/null || true
            echo "#$PR is a draft or held: auto-merge off."
          elif [ "$open" = "true" ] || [ "$URGENT" = "true" ]; then
            retry gh pr merge "$PR" -R "$REPO" --auto --squash
            echo "#$PR is ready: it merges when Click tests pass and it is up to date."
          else
            gh pr merge "$PR" -R "$REPO" --disable-auto 2>/dev/null || true
            echo "#$PR is ready: it merges in the next release window ($RELEASE_WINDOWS, Queensland time), or label it urgent."
          fi

  backfill:
    # Release now only (6 Nov 2026): the waiting run must not switch auto-merge on before its window opens
    if: github.event_name == 'workflow_dispatch' && inputs.now
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Token set?
        id: token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::AUTOMERGE_TOKEN is not set, so nothing is merged automatically (docs/auto-merge.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # Run by hand once after the token is added: every pull request already ready and not held gets auto-merge.
      - name: Switch auto-merge on for pull requests already ready
        if: steps.token.outputs.ok == 'true'
        run: |
          retry() { for i in 1 2 3; do "$@" && return 0; [ "$i" = 3 ] || sleep $((i * 10)); done; return 1; }   # as in switch
          for n in $(retry gh pr list -R "$REPO" --base main --state open --limit 50 --json number,isDraft,labels,isCrossRepository \
              --jq '.[] | select(.isDraft|not) | select(.isCrossRepository|not) | select([.labels[].name] | index("hold") | not) | .number'); do
            retry gh pr merge "$n" -R "$REPO" --auto --squash && echo "#$n: auto-merge on." || echo "#$n: GitHub refused three times; run this again later."
          done

  # The waiting run (6 Nov 2026). On 5 Nov GitHub ran 3 of the queue's timed runs in 14 hours, none in a window, so
  # nothing merged that night. When the queue finds ready pull requests outside a window, it starts this run (Run
  # workflow with wait), which sleeps until a minute after the next window opens; the queue below then switches
  # auto-merge on and moves the queue. Runners cost nothing on a public repository. GitHub stops a job after 6 hours,
  # so a longer wait sleeps 5 hours 45 minutes and the queue after it starts the next wait.
  # tests/auto-merge-queue.test.js runs this step too: no GitHub expressions in it.
  wait:
    if: github.event_name == 'workflow_dispatch' && inputs.wait
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Sleep until the next release window
        run: |
          now=${NOW_HHMM:-$(TZ=Australia/Brisbane date +%H%M)}
          mins=$((10#${now:0:2} * 60 + 10#${now:2:2})); best=-1; open=false
          for w in $RELEASE_WINDOWS; do
            s=${w%-*}; e=${w#*-}
            [ $((10#$now)) -ge $((10#$s)) ] && [ $((10#$now)) -lt $((10#$e)) ] && open=true
            d=$(( (10#${s:0:2} * 60 + 10#${s:2:2} - mins + 1440) % 1440 ))
            if [ "$best" -lt 0 ] || [ "$d" -lt "$best" ]; then best=$d; fi
          done
          # Use the same dated extension as switch and queue, so a new waiting run moves on while it is open.
          if [[ "${RELEASE_UNTIL:-}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] &&
             release_end=$(date -u -d "$RELEASE_UNTIL" +%s 2>/dev/null) &&
             [ "${NOW_EPOCH:-$(date -u +%s)}" -lt "$release_end" ]; then
            open=true; echo "Dated release extension: the window is open until $RELEASE_UNTIL."
          fi
          if [ "$open" = "true" ]; then echo "A release window is open now."; exit 0; fi
          secs=$((best * 60 + 60)); cap=20700
          if [ "$secs" -gt "$cap" ]; then
            echo "The next window opens in $best minutes: waiting 5 hours 45 minutes, then the queue starts the next wait."; secs=$cap
          else
            echo "The next window opens in $best minutes: waiting until a minute after it opens."
          fi
          sleep "$secs"

  queue:
    needs: [switch, backfill, wait]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Up to 10 minutes of asking GitHub about an UNKNOWN pull request, plus the rest of the pass.
    timeout-minutes: 15
    concurrency:
      group: auto-merge-queue
      cancel-in-progress: false
    # actions: write starts the waiting run; actions: read finds Release now and the waiting run by name
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
      REPO: ${{ github.repository }}
      RELEASE_NOW: ${{ github.event_name == 'workflow_dispatch' && inputs.now }}
      RUNS_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Token set?
        id: token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::AUTOMERGE_TOKEN is not set, so nothing is merged automatically (docs/auto-merge.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # Release windows (5 Nov 2026): in a window, or within 30 minutes of a Release now, every ready pull request that
      # is not held gets auto-merge, and the queue below moves them on one at a time. Outside, auto-merge goes off again
      # on all but the urgent ones, so nothing merges and no phone reloads until the next window, and the queue makes
      # sure one run waits to open it (the wait job above). One already merging when a window closes may still finish.
      # tests/auto-merge-queue.test.js runs this step too: no GitHub expressions.
      - name: Open or close the release window
        if: steps.token.outputs.ok == 'true'
        run: |
          retry() { for i in 1 2 3; do "$@" && return 0; [ "$i" = 3 ] || sleep $((i * 10)); done; return 1; }   # as in switch
          now=${NOW_HHMM:-$(TZ=Australia/Brisbane date +%H%M)}; open=false
          for w in $RELEASE_WINDOWS; do [ $((10#$now)) -ge $((10#${w%-*})) ] && [ $((10#$now)) -lt $((10#${w#*-})) ] && open=true; done
          # The same dated extension as switch: expire on the exact UTC deadline, without changing daily windows.
          if [[ "${RELEASE_UNTIL:-}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] &&
             release_end=$(date -u -d "$RELEASE_UNTIL" +%s 2>/dev/null) &&
             [ "${NOW_EPOCH:-$(date -u +%s)}" -lt "$release_end" ]; then
            open=true; echo "Dated release extension: the window is open until $RELEASE_UNTIL."
          fi
          # A Release now holds the window open for 30 minutes (6 Nov 2026), as in switch: it used to last only its own
          # run, so the next run (started by its own update of a pull request) closed the window again.
          released() { GH_TOKEN="$RUNS_TOKEN" gh api "repos/$REPO/actions/workflows/auto-merge.yml/runs?event=workflow_dispatch&per_page=20" \
            --jq '[.workflow_runs[] | select(.display_title == "Release now") | select(now - (.created_at | fromdateiso8601) < 1800)] | length' 2>/dev/null | grep -qv '^0$'; }
          if [ "$RELEASE_NOW" = "true" ]; then open=true; echo "Release now, by hand: the window is open for 30 minutes."
          elif [ "$open" != "true" ] && released; then open=true; echo "Released by hand in the last 30 minutes: the window is open."; fi
          echo "Release windows $RELEASE_WINDOWS (Queensland time). Now $now: open $open."
          retry gh pr list -R "$REPO" --base main --state open --limit 50 --json number,isDraft,labels,autoMergeRequest,isCrossRepository \
            --jq '.[] | select(.isDraft|not) | select(.isCrossRepository|not) | select([.labels[].name] | index("hold") | not)
                  | "\(.number) \(.autoMergeRequest != null) \([.labels[].name] | index("urgent") != null)"' > ready.txt
          waiting=0
          while read -r n on urgent <&3; do
            if [ "$open" = "true" ] || [ "$urgent" = "true" ]; then
              if [ "$on" = "true" ]; then continue; fi
              if retry gh pr merge "$n" -R "$REPO" --auto --squash; then echo "#$n: auto-merge on."
              else echo "::warning::#$n: GitHub refused auto-merge three times. The next pass tries again."; fi
            else
              waiting=$((waiting + 1))
              if [ "$on" = "true" ]; then
                gh pr merge "$n" -R "$REPO" --disable-auto 2>/dev/null || true
                echo "#$n: waits for the next release window."
              fi
            fi
          done 3< ready.txt
          # Something waits for a window: make sure one run waits to open it (the wait job). Not this run itself, which
          # may be a waiting run that woke after 5 hours 45 minutes with the window still shut.
          if [ "$waiting" -gt 0 ]; then
            busy=$(GH_TOKEN="$RUNS_TOKEN" gh api "repos/$REPO/actions/workflows/auto-merge.yml/runs?event=workflow_dispatch&per_page=20" \
              --jq '[.workflow_runs[] | select(.display_title == "Waiting for the release window") | select(.status != "completed") | select(.id != ($ENV.RUN_ID | tonumber))] | length' 2>/dev/null) || busy=''
            if [ "$busy" = "0" ]; then
              if retry env GH_TOKEN="$RUNS_TOKEN" gh workflow run auto-merge.yml -R "$REPO" -f wait=true; then echo "Started a run that waits for the next window."
              else echo "::warning::Could not start the run that waits for the next window. The timed runs and Release now still work."; fi
            elif [ -n "$busy" ]; then echo "A run already waits for the next window."
            else echo "::warning::Could not look for the run that waits for the next window. The next pass looks again."; fi
          fi
          echo "Done."

      # The queue: oldest ready pull request first. Clean merges by itself; up to date and still testing means wait;
      # failed or in conflict is skipped until its session fixes it; behind is brought up to date (one, then stop).
      # UNKNOWN means GitHub has not worked out yet whether it merges cleanly. It never stops the queue (4 Nov 2026: #516
      # stayed UNKNOWN for over 50 minutes and #517 and #520 waited behind it). The queue asks GitHub again every 10
      # seconds (asking also starts GitHub's check), at least once and until 10 minutes after that pull request last
      # changed; the whole pass shares one wait. Worked out by then: handled as what it is. Still UNKNOWN: skipped this
      # pass. Nothing is kept between passes, so a later pass reads it fresh and takes it up once GitHub knows.
      # Testing means a PR click tests check on the newest commit is still running. Click tests runs in shares on
      # several runners and the required "Click tests" check only appears when every share is done, so asking for the
      # required check alone read a pull request in the middle of its run as failed (4 Nov 2026: #520). No PR click
      # tests check at all: just pushed, so the queue asks again like UNKNOWN; still none 10 minutes after the change
      # means Click tests never started on that commit (#516 on 4 Nov 2026), skipped until its session pushes again.
      # tests/auto-merge-queue.test.js runs this step with a stand-in for gh: keep GitHub expressions out of it.
      - name: Move the queue on by one
        if: steps.token.outputs.ok == 'true'
        run: |
          grace=600; every=10; waited=0   # seconds: GitHub's time after a change, between asks, waited so far this pass
          # PR click tests checks on a pull request's newest commit: "how many, how many still running".
          click() {
            gh pr checks "$1" -R "$REPO" --json workflow,bucket \
              --jq '[.[] | select(.workflow == "PR click tests")] | "\(length) \([.[] | select(.bucket == "pending")] | length)"' \
              2>/dev/null || echo "0 0"
          }
          # The list and Update branch are tried three times, 10 and 20 seconds apart, as in switch: one GitHub error must
          # not stall the queue until the next pass.
          retry() { for i in 1 2 3; do "$@" && return 0; [ "$i" = 3 ] || sleep $((i * 10)); done; return 1; }
          retry gh pr list -R "$REPO" --base main --state open --limit 50 \
            --json number,isDraft,labels,mergeStateStatus,autoMergeRequest,isCrossRepository,createdAt,updatedAt \
            --jq 'sort_by(.createdAt) | .[] | select(.isDraft|not) | select(.isCrossRepository|not)
                  | select(.autoMergeRequest != null) | select([.labels[].name] | index("hold") | not)
                  | "\(.number) \(.mergeStateStatus) \(now - (.updatedAt | fromdateiso8601) | floor)"' > queue.txt
          echo "Ready pull requests, oldest first (number, state, seconds since it last changed):"; cat queue.txt
          # The list is read on its own handle, so no command in the loop can swallow lines of it.
          while read -r n state since <&3; do
            if [ "$state" = "UNKNOWN" ]; then
              asks=$(( (grace - since - waited + every - 1) / every )); [ "$asks" -ge 1 ] || asks=1
              for ((i = 0; i < asks; i++)); do
                sleep "$every"; waited=$((waited + every))
                state=$(gh api "repos/$REPO/pulls/$n" --jq '(.mergeable_state // "unknown") | ascii_upcase') || state=UNKNOWN
                state=${state:-UNKNOWN}
                if [ "$state" != "UNKNOWN" ]; then echo "#$n: GitHub has worked it out: $state."; break; fi
              done
            fi
            case "$state" in
              CLEAN|HAS_HOOKS|UNSTABLE) echo "#$n is merging."; exit 0 ;;
              UNKNOWN) echo "#$n is still UNKNOWN to GitHub, $(( (since + waited) / 60 )) min after its last change: skipped this pass. The next pass looks again."; continue ;;
              DIRTY) echo "#$n has a conflict: skipped until its session fixes it."; continue ;;
            esac
            read -r total running <<< "$(click "$n")"
            while [ "${total:-0}" = 0 ] && [ $((since + waited)) -lt "$grace" ]; do
              sleep "$every"; waited=$((waited + every))
              read -r total running <<< "$(click "$n")"
            done
            if [ "${running:-0}" -gt 0 ]; then echo "#$n is testing: wait."; exit 0; fi
            if [ "${total:-0}" = 0 ]; then echo "#$n has no Click tests on its newest commit, $(( (since + waited) / 60 )) min after its last change: skipped until its session pushes again."; continue; fi
            set +e; gh pr checks "$n" -R "$REPO" --required >/dev/null 2>&1; c=$?; set -e
            if [ "$c" = "8" ]; then echo "#$n is testing: wait."; exit 0; fi
            if [ "$c" != "0" ]; then echo "#$n failed Click tests: skipped until its session fixes it."; continue; fi
            if [ "$state" = "BEHIND" ]; then
              retry gh api -X PUT "repos/$REPO/pulls/$n/update-branch" >/dev/null && echo "#$n brought up to date: it tests, then merges." \
                || echo "::warning::#$n: GitHub refused to bring it up to date three times. The next pass tries again."
              exit 0
            fi
            echo "#$n is $state: skipped."
          done 3< queue.txt
          echo "Nothing to move."
