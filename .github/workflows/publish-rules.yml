# Publish the Firestore rules from GitHub, so nobody needs the Firebase console or a laptop.
# Runs once per venue (venues/*.json, docs/venues.md), each in its own GitHub environment named like the venue, with its
# own FIREBASE_SA (service account key, JSON), KITCHEN_PIN and OWNER_EMAIL (the venue owner: its head chef's Google
# email), and PLATFORM_EMAIL and PLATFORM_STAFF_ID (the platform owner's Google email and his own profile at that
# venue). At Leichhardt the owner is the platform owner: PLATFORM_EMAIL may be left out (it is OWNER_EMAIL) and
# PLATFORM_STAFF_ID is left out (empty). Leichhardt's secrets may still be repository secrets until they move.
# Fills them into a copy of firestore.rules in the runner's temporary folder and deploys that copy with the Firebase CLI,
# signed in as that venue's service account, to that venue's project only (scripts/venues.cjs guard,
# scripts/publish-rules.cjs). After publishing it proves the lock on that venue's live book (tests/rules/probe.mjs).
# Run it from the Actions tab with "Run workflow": one venue or all. A head chef change at a venue is a change of its
# OWNER_EMAIL secret, then this workflow for that venue in its release window (docs/venues.md).
# Nothing secret is ever printed: GitHub masks the secrets in the log, and the filled-in copy is never shown or kept.
# The move to a new kitchen PIN (two PINs live at once) is still pasted by hand: see the header of firestore.rules.
# It follows Publish site by itself (workflow_run), except after a run GitHub's bot started (the window run), when
# GitHub starts nothing: that run starts this with site_run and site_sha, and it decides exactly as after it
# (27 Nov 2026, docs/site-publishing.md).
name: Publish rules

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview preparation counts, verify existing foundation, or prepare and publish rules
        required: true
        default: publish
        type: choice
        options: [preview, verify, publish]
      venue:
        description: The venue's id (venues/<id>.json), or all
        required: true
        default: all
        type: string
      first:
        description: First publish for a new venue (its book has no settings yet)
        required: false
        default: false
        type: boolean
      site_run:
        description: Leave empty. Set by Publish site's window run, which starts this itself after it published
        required: false
        default: ''
        type: string
      site_sha:
        description: Leave empty. The commit that window run published
        required: false
        default: ''
        type: string
  workflow_run:
    workflows: ["pages-build-deployment", "Publish site"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-rules
  cancel-in-progress: false

jobs:
  changes:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.access.outputs.publish }}
      venues: ${{ steps.venues.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.site_sha || github.sha }}
          fetch-depth: 0
          filter: blob:none
      - id: access
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FROM: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER: ${{ github.event.workflow_run.event }}
          SITE_RUN: ${{ inputs.site_run }}
          SITE_SHA: ${{ inputs.site_sha }}
        run: |
          # Started by Publish site's window run (27 Nov 2026): GitHub starts nothing after a run its bot started, so that
          # run starts this itself and names itself and the commit it published. Decide exactly as after it, from main only.
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ -n "${SITE_RUN:-}${SITE_SHA:-}" ]; then
            if ! [[ "${SITE_RUN:-}" =~ ^[0-9]+$ ]] || ! [[ "${SITE_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::site_run must be a run number and site_sha a whole commit id. Nothing published."; exit 1
            fi
            if [ "$(git rev-parse HEAD)" != "$SITE_SHA" ] || ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::The commit to follow is not this checkout on main. Nothing published."; exit 1
            fi
            EVENT_NAME=workflow_run; FROM="Publish site"; RUN_ID=$SITE_RUN; TRIGGER=window
          fi
          # After Publish site (13 Nov 2026, docs/site-publishing.md): only once its Published job ran, so the site is up to
          # date with this commit. It runs also when nothing needed publishing (a change to the rules alone), and not while
          # Pages still publishes from the branch, when GitHub's own publish brings this workflow instead.
          if [ "$EVENT_NAME" = workflow_run ] && [ "$FROM" = "Publish site" ]; then
            ran=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --jq '[.jobs[] | select(.name == "Published" and .conclusion == "success")] | length' 2>/dev/null || echo 1)
            if [ "$ran" = 0 ]; then echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0; fi
            # Publish times (24 Nov 2026): a change to the site can wait for a publish window, and its rules wait with it
            # (Published does not run while it is held). When the site goes out, every rules change since the version
            # that was live before it goes out too, not only the last commit's.
            # the window run starts this only once its Deploy succeeded: GitHub not answering then counts as published
            deployed=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --jq '[.jobs[] | select(.name == "Deploy" and .conclusion == "success")] | length' 2>/dev/null || { [ "$TRIGGER" = window ] && echo 1 || echo 0; })
            if [ "$deployed" != 0 ]; then
              head=$(git rev-parse HEAD); before=""
              for pair in $(gh api "repos/$REPO/deployments?environment=github-pages&per_page=30" --jq '.[] | "\(.id):\(.sha)"' 2>/dev/null || true); do
                [ "${pair#*:}" = "$head" ] && continue
                if [ "$(gh api "repos/$REPO/deployments/${pair%%:*}/statuses?per_page=30" --jq '[.[].state] | index("success") != null' 2>/dev/null || true)" = true ]; then before=${pair#*:}; break; fi
              done
              if [ -z "$before" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
                echo "The version live before this one is not known: publishing the rules rather than miss a change."; echo "publish=true" >> "$GITHUB_OUTPUT"; exit 0
              fi
              if git diff --no-renames --name-only "$before" HEAD | grep -Eq '^(firestore.rules|scripts/access-bootstrap.mjs|scripts/ping-index.mjs|.github/workflows/publish-rules.yml)$'; then
                echo "The rules changed since ${before:0:7}, the version live before: publishing them after their code."; echo "publish=true" >> "$GITHUB_OUTPUT"
              else
                echo "publish=false" >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi
            # a timed or window publish run with nothing to publish brings no rules (it would publish the last commit's again)
            if [ "$TRIGGER" = schedule ] || [ "$TRIGGER" = window ]; then echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          fi
          if [ "$EVENT_NAME" = workflow_dispatch ] || git diff-tree --no-commit-id --name-only -r HEAD | grep -Eq '^(firestore.rules|scripts/access-bootstrap.mjs|scripts/ping-index.mjs|.github/workflows/publish-rules.yml)$'; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Venues
        id: venues
        env:
          PICK: ${{ github.event_name == 'workflow_dispatch' && inputs.venue || 'all' }}
        run: |
          set -euo pipefail
          list=$(node scripts/venues.cjs matrix)
          if [ "$PICK" != all ]; then
            list=$(printf '%s' "$list" | PICK="$PICK" node -e 'const l=JSON.parse(require("fs").readFileSync(0,"utf8")).filter(v=>v.id===process.env.PICK);if(!l.length){console.error("No venue named "+JSON.stringify(process.env.PICK.slice(0,40))+". Nothing published.");process.exit(1)}console.log(JSON.stringify(l))')
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
  publish:
    needs: changes
    if: needs.changes.outputs.publish == 'true'
    name: Publish (${{ matrix.venue.id }})
    strategy:
      fail-fast: false
      matrix:
        venue: ${{ fromJSON(needs.changes.outputs.venues) }}
    environment:
      name: ${{ matrix.venue.env }}
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VENUE: ${{ matrix.venue.id }}
      VENUE_PROJECT: ${{ vars.VENUE_PROJECT }}
      VENUE_NEW: ${{ github.event_name == 'workflow_dispatch' && inputs.first && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.site_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/rules/package-lock.json
      - name: This venue's own project
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: node scripts/venues.cjs guard "$VENUE"
      - name: Install the Firebase CLI (the copy the rules tests use)
        working-directory: tests/rules
        run: npm ci --no-audit --no-fund
      - name: Install transfer index dependencies
        working-directory: scripts
        run: npm ci --no-audit --no-fund
      - name: Carry existing transfers into the outstanding list
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'publish'
        working-directory: scripts
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          KITCHEN_PIN: ${{ secrets.KITCHEN_PIN }}
        run: node transfer-index.mjs
      # PLATFORM_ID (24 Nov 2026, docs/venues.md): the platform owner's profile at this venue, written to config/platform
      # (empty at Leichhardt, where that record must not exist). Checked before any read; never printed.
      - name: Preview, verify or prepare canonical access
        working-directory: scripts
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          KITCHEN_PIN: ${{ secrets.KITCHEN_PIN }}
          PLATFORM_ID: ${{ secrets.PLATFORM_STAFF_ID }}
          ACCESS_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'publish' }}
        run: |
          case "$ACCESS_MODE" in
            preview) node access-bootstrap.mjs --dry-run ;;
            verify) node access-bootstrap.mjs --verify ;;
            publish) node access-bootstrap.mjs ;;
            *) echo "Unknown access workflow mode."; exit 1 ;;
          esac
      - name: Check the wastage history range query
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'publish'
        working-directory: scripts
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          KITCHEN_PIN: ${{ secrets.KITCHEN_PIN }}
        run: node waste-range-check.mjs
      - name: Prepare the private ping recipient index
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'publish'
        working-directory: scripts
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          KITCHEN_PIN: ${{ secrets.KITCHEN_PIN }}
        run: node ping-index.mjs
      # Two admins at a venue (19 Nov 2026, docs/venues.md): PLATFORM_EMAIL is OWNER_EMAIL when the venue has none (at
      # Leichhardt they are one person) and PLATFORM_ID is the platform owner's profile there, empty at Leichhardt.
      - name: Fill in the template
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'publish'
        env:
          KITCHEN_PIN: ${{ secrets.KITCHEN_PIN }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          PLATFORM_EMAIL: ${{ secrets.PLATFORM_EMAIL }}
          PLATFORM_ID: ${{ secrets.PLATFORM_STAFF_ID }}
        run: |
          set -euo pipefail
          email='^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'
          [[ "$KITCHEN_PIN" =~ ^[0-9]{4,8}$ ]] || { echo "The KITCHEN_PIN secret is missing or not 4 to 8 digits."; exit 1; }
          [[ "$OWNER_EMAIL" =~ $email ]] || { echo "The OWNER_EMAIL secret is missing or not an email address."; exit 1; }
          if [ -n "$PLATFORM_ID" ] && [ -z "$PLATFORM_EMAIL" ]; then echo "PLATFORM_STAFF_ID is set but PLATFORM_EMAIL is not. Nothing published."; exit 1; fi
          PLATFORM_EMAIL="${PLATFORM_EMAIL:-$OWNER_EMAIL}"
          [[ "$PLATFORM_EMAIL" =~ $email ]] || { echo "The PLATFORM_EMAIL secret is not an email address."; exit 1; }
          [[ "$PLATFORM_ID" =~ ^[A-Za-z0-9_-]{0,80}$ ]] || { echo "The PLATFORM_STAFF_ID secret is not a profile id."; exit 1; }
          mkdir -p "$RUNNER_TEMP/rules"
          sed "s/KITCHEN_PIN/$KITCHEN_PIN/g;s/OWNER_EMAIL/$OWNER_EMAIL/g;s/PLATFORM_EMAIL/$PLATFORM_EMAIL/g;s/PLATFORM_ID/$PLATFORM_ID/g" firestore.rules > "$RUNNER_TEMP/rules/firestore.rules"
          if grep -q 'KITCHEN_PIN\|OWNER_EMAIL\|PLATFORM_EMAIL\|PLATFORM_ID' "$RUNNER_TEMP/rules/firestore.rules"; then echo "A placeholder was left in. Nothing published."; exit 1; fi
          printf '{ "firestore": { "rules": "firestore.rules" } }\n' > "$RUNNER_TEMP/rules/firebase.json"
      - name: Publish
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'publish'
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          set -euo pipefail
          [ -n "$FIREBASE_SA" ] || { echo "The FIREBASE_SA secret is missing."; exit 1; }
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          cd "$RUNNER_TEMP/rules"
          node "$GITHUB_WORKSPACE/scripts/publish-rules.cjs"
          rm -f "$RUNNER_TEMP/sa.json" "$RUNNER_TEMP/rules/firestore.rules"
          echo "Published. Changes can take up to a minute to reach the phones."
      - name: Verify canonical access after publication
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'publish'
        working-directory: scripts
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          KITCHEN_PIN: ${{ secrets.KITCHEN_PIN }}
          PLATFORM_ID: ${{ secrets.PLATFORM_STAFF_ID }}
        run: sleep 60 && node access-bootstrap.mjs --verify
      # Proves the lock on the live book straight after publishing: the reads and writes the rules must refuse, from a
      # client that holds only the kitchen PIN, plus the one read they must allow. Fails the run if any is wrong.
      - name: Prove the lock on the live book
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'publish'
        working-directory: tests/rules
        env:
          KITCHEN_PIN: ${{ secrets.KITCHEN_PIN }}
          APPCHECK_DEBUG_TOKEN: ${{ secrets.APPCHECK_DEBUG_TOKEN }}
        run: sleep 20 && node probe.mjs
