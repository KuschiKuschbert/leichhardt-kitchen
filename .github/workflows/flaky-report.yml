# The weekly list of click test files that needed a second try (4 Nov 2026, scripts/flaky-report.mjs). Every Monday at
# 07:13 kitchen time it reads the past week's Click tests and Live click tests annotations and keeps one issue up to
# date ("Click tests that needed a second try (weekly)", label flaky-report). A file marked "Yes" there is fixed in its
# own pull request. Reads runs and annotations only; writes that one issue; no secrets beyond the built-in token.
name: Flaky test report

on:
  schedule:
    - cron: '13 21 * * 0'
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  issues: write
  contents: read

concurrency:
  group: flaky-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Write the weekly list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/flaky-report.mjs
